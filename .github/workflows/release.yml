name: Release APK

# Se dispara al pushear un tag tipo v1.8.0 (ver RELEASES.md para el paso a
# paso). Compila el APK de release, lo firma con el keystore que reusa la
# firma de la app ya instalada (secrets del repo), y publica un GitHub
# Release con el .apk + latest.json — que es lo que la app misma consulta
# desde src/update/updater.ts para saber si hay una versión más nueva.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Compute version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # 1000 de base para quedar siempre por encima del versionCode
          # que ya tiene instalado cualquier build vieja hecha a mano.
          VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Bump version y versionCode en app.json
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" \
             --argjson vc "${{ steps.version.outputs.version_code }}" \
             '.expo.version = $v | .expo.android.versionCode = $vc' \
             app.json > app.json.tmp
          mv app.json.tmp app.json

      - name: Decodificar el keystore de release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "Falta el secret RELEASE_KEYSTORE_BASE64 en el repo. Ver RELEASES.md." >&2
            exit 1
          fi
          mkdir -p "$HOME/keystore"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$HOME/keystore/release.keystore"

      - name: Configurar firma en ~/.gradle/gradle.properties
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_ALIAS" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "Faltan secrets de firma (RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD). Ver RELEASES.md." >&2
            exit 1
          fi
          mkdir -p "$HOME/.gradle"
          {
            echo "TINMANGAS_RELEASE_STORE_FILE=$HOME/keystore/release.keystore"
            echo "TINMANGAS_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "TINMANGAS_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "TINMANGAS_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$HOME/.gradle/gradle.properties"

      - name: Generar proyecto nativo (expo prebuild)
        run: npx expo prebuild -p android --no-install --clean

      - name: Compilar APK de release
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Ubicar el APK generado
        id: apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No se encontró ningún .apk en android/app/build/outputs/apk/release" >&2
            exit 1
          fi
          FINAL_NAME="TinMangas-${{ steps.version.outputs.version }}.apk"
          cp "$APK_PATH" "$FINAL_NAME"
          echo "path=$FINAL_NAME" >> "$GITHUB_OUTPUT"

      - name: Generar latest.json
        run: |
          NOTES=$(git log -1 --format=%s | jq -Rs .)
          cat > latest.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "versionCode": ${{ steps.version.outputs.version_code }},
            "notes": $NOTES
          }
          EOF

      - name: Publicar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: TinMangas ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.path }}
            latest.json
